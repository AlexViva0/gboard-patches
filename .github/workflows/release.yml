name: Release from tag

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: ./gradlew :patches:buildAndroid generatePatchesList test

      - name: Validate synced release metadata
        id: metadata
        shell: pwsh
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith("v")) {
              throw "Release tag must start with 'v'."
          }

          $expectedVersion = $tag.Substring(1)
          $gradleText = Get-Content -LiteralPath "gradle.properties" -Raw
          $match = [regex]::Match($gradleText, '(?m)^\s*version\s*=\s*([^\r\n#]+?)\s*$')
          if (-not $match.Success) {
              throw "Unable to resolve version from gradle.properties."
          }

          $actualVersion = $match.Groups[1].Value.Trim()
          if ($actualVersion -ne $expectedVersion) {
              throw "Tag version '$expectedVersion' does not match gradle.properties version '$actualVersion'."
          }

          $bundle = Get-Content -LiteralPath "patches-bundle.json" -Raw | ConvertFrom-Json
          if ([string]$bundle.version -ne $actualVersion) {
              throw "patches-bundle.json version '$($bundle.version)' does not match '$actualVersion'."
          }

          $expectedDownloadUrl = "https://github.com/$($env:REPO_SLUG)/releases/download/$tag/patches-$actualVersion.mpp"

          if ([string]$bundle.download_url -ne $expectedDownloadUrl) {
              throw "patches-bundle.json download_url does not match expected public release URL."
          }
          if (-not [string]::IsNullOrEmpty([string]$bundle.signature_download_url)) {
              throw "patches-bundle.json signature_download_url must be empty (the signature is embedded in the .mpp)."
          }

          # The bundle must be signed with the key published in morphe-signing.pub.
          $publicKey = (Get-Content -LiteralPath "morphe-signing.pub" -Raw).Trim()
          if ([string]$bundle.public_key -ne $publicKey) {
              throw "patches-bundle.json public_key does not match morphe-signing.pub."
          }
          $mpp = "patches/build/libs/patches-$actualVersion.mpp"
          $bytes = [System.IO.File]::ReadAllBytes($mpp)
          $tail = [System.Text.Encoding]::ASCII.GetString($bytes, [Math]::Max(0, $bytes.Length - 256), [Math]::Min(256, $bytes.Length))
          if (-not $tail.Contains("MorpheSig1 $publicKey ")) {
              throw "$mpp is not signed with morphe-signing.pub (is the MORPHE_SIGNING_KEY secret set?)."
          }

          "version=$actualVersion" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        shell: pwsh
        run: |
          $bundle = Get-Content -LiteralPath "patches-bundle.json" -Raw | ConvertFrom-Json
          $notes = [string]$bundle.description
          if ([string]::IsNullOrWhiteSpace($notes)) {
              $notes = "Release $env:GITHUB_REF_NAME."
          }
          Set-Content -LiteralPath "release-notes.md" -Value $notes -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          files: |
            patches/build/libs/patches-${{ steps.metadata.outputs.version }}.mpp

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: patches/build/libs/patches-${{ steps.metadata.outputs.version }}.mpp
